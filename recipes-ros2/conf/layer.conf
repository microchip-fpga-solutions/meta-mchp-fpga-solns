# Layer configuration for recipes-ros2
# Contains ROS2 cross-compilation fixes for scarthgap (Python 3.12)

# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "recipes-ros2"
BBFILE_PATTERN_recipes-ros2 = "^${LAYERDIR}/"

# Priority set to 15 to override meta-ros2 classes (priority 10)
# This ensures ros_ament_cmake.bbclass with Python3 cross-compile fixes is used
BBFILE_PRIORITY_recipes-ros2 = "15"

# Layer version
LAYERVERSION_recipes-ros2 = "1"

# Layer dependencies - requires ros2-layer from meta-ros/meta-ros2
LAYERDEPENDS_recipes-ros2 = "core ros2-layer"

# Compatible Yocto releases
LAYERSERIES_COMPAT_recipes-ros2 = "scarthgap styhead"
