# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-mpfs-solutions"
BBFILE_PATTERN_meta-mpfs-solutions = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-mpfs-solutions = "6"

LAYERDEPENDS_meta-mpfs-solutions += "meta-mchp-polarfire-soc-bsp"
LAYERSERIES_COMPAT_meta-mpfs-solutions = "scarthgap styhead"
