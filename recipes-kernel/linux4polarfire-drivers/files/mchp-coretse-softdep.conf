# mchp_coretse links to the Core1588 PTP hardware clock at probe time via a
# device-tree phandle lookup ("microchip,core1588-ptp-handle") followed by
# platform_get_drvdata() on the mchp_core1588_ptp device. There is no
# EPROBE_DEFER retry in mchp_coretse's probe function, so if its probe runs
# even slightly before mchp_core1588_ptp has finished its own probe and
# called platform_set_drvdata(), the PTP clock link is permanently NULL for
# the lifetime of that load (ethtool -T eth1 then always reports
# "PTP Hardware Clock: none"). The two modules are auto-loaded by udev based
# on independent device-tree compatible-string matches, so without this
# softdep they can probe concurrently/out-of-order on every boot.
#
# This cannot be fixed by patching the vendor driver source (out of scope),
# so the ordering is instead forced here: modprobe/libkmod will always load
# mchp_core1588_ptp to completion before mchp_coretse, whether triggered by
# an explicit modprobe or by udev's automatic module auto-loading.
softdep mchp_coretse pre: mchp_core1588_ptp
