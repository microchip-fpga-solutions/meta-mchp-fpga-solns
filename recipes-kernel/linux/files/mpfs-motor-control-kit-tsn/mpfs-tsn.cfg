# CONFIG_MICROCHIP_CORETSE, CONFIG_CORE1588_HWTSTAMP and CONFIG_MICROCHIP_CORETSN
# are intentionally NOT set here. These drivers are provided out-of-tree by the
# linux4polarfire-drivers recipe (mchp-coretse, mchp-core1588-ptp, microchip-tsn
# kernel modules). Building them in-tree as well causes a duplicate platform
# driver registration for the same compatible strings, with the built-in
# driver always winning the probe - silently shadowing the out-of-tree module
# and breaking CoreTSE/CoreTSN probing.
CONFIG_PINCTRL=y
CONFIG_PINCTRL_MCP23S08=y
CONFIG_VLAN_8021Q=y
# CONFIG_MACB_USE_HWSTAMP is not set
# CONFIG_IO_STRICT_DEVMEM is not set
