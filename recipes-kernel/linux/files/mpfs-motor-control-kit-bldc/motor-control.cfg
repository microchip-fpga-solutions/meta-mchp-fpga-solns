# Motor Control IIO core support. CONFIG_IIO_MPFS_MC_* (ADC, PICON, PWM,
# RATELIM, SQMNG, STPTHETA) are intentionally NOT set here: drivers/iio/mpfs-mc/
# does not exist in linux4microchip/linux, so those symbols are not recognized
# by this kernel's Kconfig and these lines were previously dead/no-op. The
# drivers are now provided out-of-tree by the mpfs-mc-iio-drivers recipe
# instead (mpfs-mc-adc, mpfs-mc-picon, mpfs-mc-pwm, mpfs-mc-ratelim,
# mpfs-mc-sqmng, mpfs-mc-stptheta kernel modules).
CONFIG_IIO=y
CONFIG_IIO_BUFFER=y
CONFIG_IIO_KFIFO_BUF=m
